name: Palot Cloud Gateway

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - commercial/windows-runtime
    paths:
      - .github/workflows/palot-cloud-gateway.yml
      - .dockerignore
      - apps/gateway/**
      - bun.lock
      - bunfig.toml
      - package.json

permissions:
  contents: read
  packages: write

concurrency:
  group: palot-cloud-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build immutable gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/palot-cloud-gateway" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=palot-cloud-gateway
          cache-to: type=gha,mode=max,scope=palot-cloud-gateway
          provenance: mode=max
          sbom: true

      - name: Record immutable image reference
        shell: bash
        run: |
          printf '%s@%s\n' '${{ steps.image.outputs.name }}' '${{ steps.build.outputs.digest }}' \
            > palot-cloud-gateway-image.txt
          printf '%s\n' '${{ steps.build.outputs.digest }}' > palot-cloud-gateway-digest.txt

      - name: Verify published manifest
        shell: bash
        run: docker buildx imagetools inspect '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'

      - name: Upload immutable image metadata
        uses: actions/upload-artifact@v4
        with:
          name: palot-cloud-gateway-image-${{ github.sha }}
          path: |
            palot-cloud-gateway-image.txt
            palot-cloud-gateway-digest.txt
          if-no-files-found: error
          retention-days: 30
