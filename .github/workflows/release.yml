name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WINDOWS_UPGRADE_BASE_VERSION: "0.11.0"
  WINDOWS_UPGRADE_BASE_SHA256: "d5e774539bca43b7365be75464842cab1cf7af4f16db59047ad22bbb72f33595"
  # beta.3 will be the first public build containing the silent updater fix. Later RC/stable
  # releases use it as their automatic-update baseline; beta.3 itself is the bootstrap exception.
  WINDOWS_AUTO_UPDATE_BASE_VERSION: "0.12.0-beta.3"
  WINDOWS_AUTO_UPDATE_BASE_SHA256: "d5915efff4fa290bc7af176e1075acd2237a2bd6c7e8d0fee1a5c73e603987f4"
  WINDOWS_SIGNING_PUBLISHER: ${{ vars.WINDOWS_SIGNING_PUBLISHER }}

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Changeset versioning
  # ──────────────────────────────────────────────
  # On push to main: if changesets are pending, creates a "Version Packages"
  # PR. If no changesets are pending (i.e. the version PR was just merged),
  # runs `changeset tag` and outputs published=true with the new version.
  #
  # On workflow_dispatch: always proceeds to build+release using the current
  # version in package.json (useful for manual recovery or re-releases).
  #
  # Uses --ignore-scripts since this job only needs the changesets CLI,
  # not native modules.
  changeset:
    name: Changeset
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.decide.outputs.should-release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          title: "chore: version packages"
          commit: "chore: version packages"
          version: bun changeset version
          publish: bun changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: decide
        run: |
          PUBLISHED="${{ steps.changesets.outputs.published }}"
          EVENT="${{ github.event_name }}"
          if [[ "$PUBLISHED" == "true" || "$EVENT" == "workflow_dispatch" ]]; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-release=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────
  # Job 2: Build JS bundle (once, on Linux)
  # ──────────────────────────────────────────────
  # electron-vite produces platform-agnostic JS/CSS output. Building once
  # on Linux (the fastest runner) and sharing the output as an artifact
  # avoids repeating this work on every platform.
  build-js:
    name: Build JS
    needs: [changeset]
    if: needs.changeset.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Turborepo remote cache
        uses: rharkor/caching-for-turbo@v2.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build electron-vite
        run: bun run build
        working-directory: apps/desktop

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: apps/desktop/out
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 3: Package Electron app (per-platform)
  # ──────────────────────────────────────────────
  # Downloads the pre-built JS bundle and runs electron-builder only.
  # macOS is split into arm64 and x64 parallel jobs to avoid sequential
  # cross-compilation (macos-latest = ARM, macos-15-intel = Intel).
  package:
    name: Package (${{ matrix.name }})
    needs: [changeset, build-js]
    if: needs.changeset.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            eb-flags: "--linux"
            artifact-name: release-linux
          - name: macos-arm64
            os: macos-latest
            platform: mac
            eb-flags: "--mac --arm64"
            artifact-name: release-macos-arm64
          - name: macos-x64
            os: macos-15-intel
            platform: mac
            eb-flags: "--mac --x64"
            artifact-name: release-macos-x64
          - name: windows-x64
            os: windows-latest
            platform: win
            eb-flags: "--win --x64"
            artifact-name: release-windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Cache Bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: apps/desktop/out

      - name: Read Windows runtime cache key
        if: matrix.platform == 'win'
        id: windows-runtime
        shell: pwsh
        run: |
          $manifest = Get-Content apps/desktop/runtime-manifest.json -Raw | ConvertFrom-Json
          $key = "opencode-$($manifest.runtimes.opencode.version)-mingit-$($manifest.runtimes.mingit.version)-github-$($manifest.runtimes.github.version)-kubectl-$($manifest.runtimes.kubectl.version)"
          "key=$key" >> $env:GITHUB_OUTPUT

      - name: Cache Windows runtimes
        if: matrix.platform == 'win'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/palot-windows-runtime
          key: windows-runtime-${{ steps.windows-runtime.outputs.key }}-${{ hashFiles('apps/desktop/runtime-manifest.json') }}

      - name: Prepare Windows runtimes
        if: matrix.platform == 'win'
        shell: pwsh
        run: ../../scripts/prepare-windows-runtime.ps1
        working-directory: apps/desktop
        env:
          PALOT_RUNTIME_CACHE_DIR: ${{ runner.temp }}\palot-windows-runtime

      - name: Validate Windows signing configuration
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
        run: |
          $version = "${{ needs.changeset.outputs.version }}"
          $allowsUnsignedPreview = $version -match '-(?:alpha|beta)(?:\.|$)'
          if (-not $allowsUnsignedPreview -and [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            throw "Windows RC and stable releases require WINDOWS_CSC_LINK before packaging"
          }
          if (-not $allowsUnsignedPreview -and [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PUBLISHER)) {
            throw "Windows RC and stable releases require the WINDOWS_SIGNING_PUBLISHER repository variable"
          }
          if (
            -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK) -and
            [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PUBLISHER)
          ) {
            throw "Signed Windows releases require the WINDOWS_SIGNING_PUBLISHER repository variable"
          }
          if ($allowsUnsignedPreview -and [string]::IsNullOrWhiteSpace($env:WINDOWS_CSC_LINK)) {
            Write-Host "Unsigned Windows installer allowed for this Alpha or Beta preview"
          }

      - name: Package Windows app
        if: matrix.platform == 'win'
        run: bun run electron-builder ${{ matrix.eb-flags }} --config electron-builder.yml --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Package unsigned macOS or Linux app
        if: matrix.platform != 'win'
        run: bun run electron-builder ${{ matrix.eb-flags }} --config electron-builder.yml --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # macOS notarization (uncomment when configured):
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Test Windows installer
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/release/Palot-*-win-x64.exe)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows x64 installer, found $($installers.Count)"
          }
          node ./scripts/verify-windows-update-manifest.cjs `
            --manifest apps/desktop/release/latest.yml `
            --installer $installers[0].FullName `
            --version "${{ needs.changeset.outputs.version }}"
          $baseVersion = $env:WINDOWS_UPGRADE_BASE_VERSION
          $previousInstaller = Join-Path $env:RUNNER_TEMP "Palot-$baseVersion-win-x64.exe"
          $previousUrl = "https://github.com/Tony-XUYANG/palot/releases/download/v$baseVersion/Palot-$baseVersion-win-x64.exe"
          Invoke-WebRequest -Uri $previousUrl -OutFile $previousInstaller
          $actualHash = (Get-FileHash $previousInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINDOWS_UPGRADE_BASE_SHA256) {
            throw "Upgrade baseline SHA-256 mismatch: $actualHash"
          }
          $version = "${{ needs.changeset.outputs.version }}"
          $allowsUnsignedPreview = $version -match '-(?:alpha|beta)(?:\.|$)'
          $testArguments = @{
            InstallerPath = $installers[0].FullName
            PreviousInstallerPath = $previousInstaller
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PUBLISHER)) {
            $testArguments.ExpectedPublisher = $env:WINDOWS_SIGNING_PUBLISHER
          }
          if ($allowsUnsignedPreview) {
            $testArguments.AllowUnsigned = $true
          } else {
            $testArguments.RequireTimestamp = $true
          }
          ./scripts/test-windows-installer.ps1 @testArguments

      - name: Scan Windows package for sensitive information
        if: matrix.platform == 'win'
        run: node ./scripts/scan-windows-package.cjs --root apps/desktop/release/win-unpacked

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/latest-linux.yml
          retention-days: 30

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/latest-mac.yml
          retention-days: 30

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
            THIRD-PARTY-NOTICES.md
            apps/desktop/resources/runtime-licenses/THIRD-PARTY-SOURCE-OFFER.txt
          retention-days: 30

  # ──────────────────────────────────────────────
  # Job 4: Create GitHub Release
  # ──────────────────────────────────────────────
  # Downloads all build artifacts, merges the split macOS update manifests,
  # creates a git tag (if it doesn't exist), extracts the changelog, and
  # publishes a GitHub Release with all binaries.
  #
  # Uses softprops/action-gh-release which is idempotent: re-running will
  # update the existing release rather than fail.
  release:
    name: Publish Release
    needs: [changeset, package]
    if: needs.changeset.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*

      - name: Merge macOS update manifests
        run: |
          # The arm64 and x64 macOS jobs each generate their own latest-mac.yml
          # with only their architecture's files. Merge them so electron-updater
          # can serve updates to both architectures from a single manifest.
          python3 << 'PYEOF'
          import yaml, os, sys

          arm64_path = "artifacts/release-macos-arm64/latest-mac.yml"
          x64_path = "artifacts/release-macos-x64/latest-mac.yml"

          if not os.path.exists(arm64_path) or not os.path.exists(x64_path):
              print("Skipping merge: one or both latest-mac.yml files missing")
              sys.exit(0)

          with open(arm64_path) as f:
              arm64 = yaml.safe_load(f)
          with open(x64_path) as f:
              x64 = yaml.safe_load(f)

          # Use arm64 as base (default for modern Macs), append x64 files
          arm64["files"] = arm64.get("files", []) + x64.get("files", [])

          # Overwrite both so the collect step picks up the merged version
          for p in [arm64_path, x64_path]:
              with open(p, "w") as f:
                  yaml.dump(arm64, f, default_flow_style=False, sort_keys=False)

          print(f"Merged latest-mac.yml: {len(arm64['files'])} files")
          PYEOF

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( \
            -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.dmg" -o -name "*.zip" \
            -o -name "*.exe" -o -name "*.exe.blockmap" \
            -o -name "latest*.yml" \
            -o -name "THIRD-PARTY-NOTICES.md" \
            -o -name "THIRD-PARTY-SOURCE-OFFER.txt" \
          \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

      - name: Generate SHA256 checksums
        run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Create git tag
        run: |
          TAG="${{ needs.changeset.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping creation"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ needs.changeset.outputs.version }}"
          CHANGELOG_FILE="apps/desktop/CHANGELOG.md"
          BODY=""

          if [ -f "$CHANGELOG_FILE" ]; then
            # Extract content between this version header and the next version header
            CONTENT=$(awk -v version="$VERSION" '
              $0 == "## " version { found=1; next }
              found && /^## [0-9]/ { exit }
              found { print }
            ' "$CHANGELOG_FILE")
            if [ -n "$CONTENT" ]; then
              BODY="$CONTENT"
            fi
          fi

          if [ -z "$BODY" ]; then
            BODY="Release $VERSION"
          fi

          # Write to file to avoid escaping issues
          echo "$BODY" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.changeset.outputs.tag }}
          name: Palot ${{ needs.changeset.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: false
          # Stable artifacts remain prerelease until the public automatic-update gate passes.
          prerelease: true
          files: |
            release-files/*
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-auto-update:
    name: Verify public Windows automatic update
    needs: [changeset, release]
    if: >-
      needs.changeset.outputs.should-release == 'true' &&
      needs.changeset.outputs.version != '0.12.0-beta.2' &&
      needs.changeset.outputs.version != '0.12.0-beta.3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download automatic-update baseline
        shell: pwsh
        run: |
          $version = $env:WINDOWS_AUTO_UPDATE_BASE_VERSION
          $name = "Palot-$version-win-x64.exe"
          $url = "https://github.com/Tony-XUYANG/palot/releases/download/v$version/$name"
          $destination = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri $url -OutFile $destination
          if ($env:WINDOWS_AUTO_UPDATE_BASE_SHA256 -notmatch '^[a-f0-9]{64}$') {
            throw "Set WINDOWS_AUTO_UPDATE_BASE_SHA256 to the published beta.3 installer hash"
          }
          $actualHash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:WINDOWS_AUTO_UPDATE_BASE_SHA256) {
            throw "Automatic-update baseline SHA-256 mismatch: $actualHash"
          }

      - name: Wait for public update assets
        shell: pwsh
        run: |
          $version = "${{ needs.changeset.outputs.version }}"
          $baseUrl = "https://github.com/Tony-XUYANG/palot/releases/download/v$version"
          $assets = @(
            "$baseUrl/latest.yml",
            "$baseUrl/Palot-$version-win-x64.exe"
          )
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          foreach ($asset in $assets) {
            $ready = $false
            do {
              try {
                $response = Invoke-WebRequest -Uri $asset -Method Head -MaximumRedirection 5
                if ($response.StatusCode -eq 200) {
                  Write-Host "Public release asset is ready: $asset"
                  $ready = $true
                  break
                }
              } catch {
                Write-Host "Waiting for public release asset: $asset"
              }
              Start-Sleep -Seconds 10
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $ready) {
              throw "Public release asset did not become available: $asset"
            }
          }

      - name: Update through the public GitHub release
        shell: pwsh
        run: |
          $version = "${{ needs.changeset.outputs.version }}"
          $baseline = Join-Path $env:RUNNER_TEMP `
            "Palot-$env:WINDOWS_AUTO_UPDATE_BASE_VERSION-win-x64.exe"
          $arguments = @{
            BaselineInstallerPath = $baseline
            ExpectedVersion = $version
            DownloadTimeoutSeconds = 1200
            AllowUnsigned = $true
          }
          $allowsUnsignedPreview = $version -match '-(?:alpha|beta)(?:\.|$)'
          if (-not $allowsUnsignedPreview) {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PUBLISHER)) {
              throw "RC and stable automatic updates require WINDOWS_SIGNING_PUBLISHER"
            }
            $arguments.ExpectedPublisher = $env:WINDOWS_SIGNING_PUBLISHER
            $arguments.RequireTargetTimestamp = $true
          }
          ./scripts/test-windows-auto-update.ps1 @arguments

  promote-stable:
    name: Promote verified stable release
    needs: [changeset, windows-auto-update]
    if: >-
      needs.changeset.outputs.should-release == 'true' &&
      !contains(needs.changeset.outputs.version, '-')
    runs-on: ubuntu-latest
    steps:
      - name: Promote release to latest
        run: >-
          gh release edit "${{ needs.changeset.outputs.tag }}"
          --repo "${{ github.repository }}"
          --prerelease=false
          --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
